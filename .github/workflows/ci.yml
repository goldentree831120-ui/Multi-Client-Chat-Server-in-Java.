# CI for the chat server: every push and pull request builds, tests and checks all of it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build + 28 server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile server, tests and load generator
        run: javac -Xlint:all -d out src/*.java test/*.java tools/*.java
      - name: Run tests (starts the real server and connects real clients)
        run: java -ea -cp out ChatServerTest

  docker:
    name: Docker image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (runs the tests inside the build), start, check from outside
        run: ./scripts/docker-smoke.sh

  config:
    name: Alert rule tests, Prometheus/Kubernetes/dashboard/script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config (compose and Kubernetes versions)
        run: |
          for f in prometheus.yml prometheus-k8s.yml; do
            docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool \
              prom/prometheus:v3.5.0 check config "/p/$f"
          done
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules /p/alerts.test.yml
      - name: Kubernetes manifests (strict schema check against 1.33)
        run: |
          curl -fsSL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xzf kc.tgz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.1 k8s/namespace.yaml k8s/chat-server.yaml k8s/prometheus.yaml
      - name: Grafana dashboard is valid JSON and uses the provisioned data source
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("monitoring/grafana/dashboards/chat-server.json"))
          assert d["uid"] == "chat-server" and d["panels"], "dashboard uid/panels"
          for p in d["panels"]:
              assert p["datasource"]["uid"] == "prometheus", p["title"]
              assert all(t["expr"].strip() for t in p["targets"]), p["title"]
          print(f"{len(d['panels'])} panels ok")
          PY
      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning scripts/*.sh

  kubernetes:
    name: Kubernetes (kind) deploy, traffic, self-healing
    runs-on: ubuntu-latest
    needs: [java, docker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install kind and kubectl (checksums verified)
        run: ./scripts/install-k8s-tools.sh
      - name: Create cluster, deploy, check, send traffic, delete the Pod
        run: ./scripts/k8s-up.sh
      - name: Show cluster state if anything failed
        if: failure()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kubectl -n chat get all -o wide || true
          kubectl -n chat describe pods || true
          kubectl -n chat logs deploy/chat-server --tail=100 || true
