# Same as prometheus.yml, but the target is the chat server's Kubernetes Service:
# <service>.<namespace>.svc.cluster.local, which cluster DNS resolves to the current Pod.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: chat
    static_configs:
      - targets: ["chat-server.chat.svc.cluster.local:9100"]
