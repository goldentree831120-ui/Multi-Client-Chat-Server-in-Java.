# Scrape the chat server every 5 s and evaluate the alert rules in alerts.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: chat
    static_configs:
      - targets: ["chat:9100"]   # the compose service name; Kubernetes will use a Service name
